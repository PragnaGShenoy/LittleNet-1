<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Screen Time | LittleNet</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{

background:#f5f7fb;
color:#222;
padding:20px;

}

.container{

max-width:650px;
margin:auto;

}

.header{

display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:30px;

}

.logo{

font-size:30px;
font-weight:700;
color:#2563EB;

}

.back{

text-decoration:none;
color:#2563EB;
font-weight:600;

}

.card{

background:white;
padding:35px;
border-radius:22px;
box-shadow:0 10px 30px rgba(0,0,0,.08);

}

.icon{

width:90px;
height:90px;
margin:auto;
margin-bottom:20px;
border-radius:50%;
background:#EEF4FF;

display:flex;
justify-content:center;
align-items:center;

font-size:42px;
color:#2563EB;

}

h1{

text-align:center;
margin-bottom:10px;

}

.subtitle{

text-align:center;
color:#777;
margin-bottom:30px;

}

.child{

background:#f8f9fc;
padding:15px;
border-radius:14px;
margin-bottom:25px;
font-size:17px;
font-weight:600;

}

.group{

margin-bottom:25px;

}

.group label{

display:block;
font-weight:600;
margin-bottom:10px;

}

.group input[type=number]{

width:100%;
padding:15px;
border-radius:12px;
border:1px solid #ddd;
font-size:16px;
outline:none;

}

.group input[type=number]:focus{

border-color:#2563EB;

}

.switch{

display:flex;
justify-content:space-between;
align-items:center;
padding:18px;
background:#f8f9fc;
border-radius:14px;

}

.switch label{

font-weight:600;

}

.switch input{

width:22px;
height:22px;
accent-color:#2563EB;

}

.info{

margin-top:20px;
padding:18px;
background:#EEF4FF;
border-left:5px solid #2563EB;
border-radius:10px;
color:#444;
line-height:1.7;

}

button{

width:100%;
margin-top:30px;
padding:16px;
border:none;
border-radius:14px;
background:linear-gradient(135deg,#2563EB,#4F46E5);
color:white;
font-size:17px;
font-weight:600;
cursor:pointer;
transition:.3s;

}

button:hover{

transform:translateY(-2px);
box-shadow:0 10px 25px rgba(37,99,235,.30);

}

@media(max-width:768px){

.card{

padding:25px;

}

.logo{

font-size:24px;

}

}

</style>

</head>

<body>

<div class="container">

<div class="header">

<div class="logo">

LittleNet

</div>

<a href="/parent/dashboard/" class="back">

<i class="fa-solid fa-arrow-left"></i>

Dashboard

</a>

</div>

<div class="card">

<div class="icon">

<i class="fa-solid fa-clock"></i>

</div>

<h1>

Screen Time Settings

</h1>

<p class="subtitle">

Manage your child's daily screen time.

</p>

<div class="child">

👦 Child:
<strong>{{ child.full_name }}</strong>

</div>

<form method="POST">

<div class="group">

<label>

Daily Limit (Minutes)

</label>

<input
type="number"
name="daily_limit"
value="{{ limit_data.daily_limit_minutes if limit_data else '' }}"
required>

</div>

<div class="switch">

<label>

Enable Strict Mode

</label>

<input
type="checkbox"
name="strict_mode"

{% if limit_data and limit_data.strict_mode %}

checked

{% endif %}>

</div>

<div class="info">

<strong>Strict Mode</strong><br><br>

When enabled, LittleNet automatically logs the child out as soon as the daily screen-time limit is reached. The child cannot continue using the app until the next day.

</div>

<button type="submit">

<i class="fa-solid fa-floppy-disk"></i>

Save Settings

</button>

</form>

</div>

</div>

</body>

</html>
