<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Child Profile | LittleNet</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{

background:#f5f7fb;
color:#222;
padding-bottom:40px;

}

.header{

position:sticky;
top:0;
background:white;
padding:18px 20px;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid #ddd;
z-index:100;

}

.logo{

font-size:30px;
font-weight:700;
color:#2563EB;

}

.back{

text-decoration:none;
color:#2563EB;
font-weight:600;

}

.container{

max-width:800px;
margin:30px auto;
padding:0 15px;

}

.profile-card{

background:white;
border-radius:22px;
padding:35px;
box-shadow:0 10px 30px rgba(0,0,0,.08);

}

.profile-top{

display:flex;
align-items:center;
gap:25px;
margin-bottom:30px;
flex-wrap:wrap;

}

.avatar{

width:120px;
height:120px;
border-radius:50%;
background:linear-gradient(135deg,#2563EB,#4F46E5);

display:flex;
justify-content:center;
align-items:center;

color:white;
font-size:48px;

}

.name{

font-size:32px;
font-weight:700;

}

.subtitle{

color:#666;
margin-top:8px;

}

.info-grid{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:18px;
margin-top:20px;

}

.info-box{

background:#f8f9fc;
padding:18px;
border-radius:14px;

}

.info-box h3{

font-size:15px;
color:#2563EB;
margin-bottom:8px;

}

.info-box p{

font-size:16px;
font-weight:500;

}

.bio{

margin-top:25px;
background:#f8f9fc;
padding:20px;
border-radius:15px;

}

.bio h3{

color:#2563EB;
margin-bottom:12px;

}

.bio p{

line-height:1.8;
color:#444;

}

@media(max-width:768px){

.profile-top{

justify-content:center;
text-align:center;

}

.logo{

font-size:24px;

}

.name{

font-size:26px;

}

.avatar{

width:100px;
height:100px;
font-size:42px;

}

}

</style>

</head>

<body>

<div class="header">

<div class="logo">

LittleNet

</div>

<a href="/parent/dashboard/" class="back">

<i class="fa-solid fa-arrow-left"></i>

Dashboard

</a>

</div>

<div class="container">

<div class="profile-card">

<div class="profile-top">

<div class="avatar">

<i class="fa-solid fa-user"></i>

</div>

<div>

<div class="name">

{{ profile.full_name }}

</div>

<div class="subtitle">

Child Profile Information

</div>

</div>

</div>

<div class="info-grid">

<div class="info-box">

<h3>

Age

</h3>

<p>

{{ profile.age }}

</p>

</div>

<div class="info-box">

<h3>

School

</h3>

<p>

{{ profile.school_name }}

</p>

</div>

<div class="info-box">

<h3>

Location

</h3>

<p>

{{ profile.location }}

</p>

</div>

<div class="info-box">

<h3>

Class

</h3>

<p>

{{ profile.current_class }}

</p>

</div>

</div>

<div class="bio">

<h3>

About

</h3>

<p>

{{ profile.bio }}

</p>

</div>

</div>

</div>

</body>

</html>
