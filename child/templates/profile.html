<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LittleNet Profile</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{

background:#F5F7FB;

padding:20px;

color:#222;

}

.container{

max-width:700px;

margin:auto;

}

.profile-card{

background:white;

border-radius:22px;

padding:30px;

box-shadow:0 10px 30px rgba(0,0,0,.08);

}

.header{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:30px;

}

.logo{

font-size:28px;

font-weight:700;

color:#2563EB;

}

.avatar{

width:120px;

height:120px;

margin:auto;

border-radius:50%;

background:linear-gradient(135deg,#4F46E5,#2563EB);

display:flex;

justify-content:center;

align-items:center;

font-size:48px;

color:white;

margin-bottom:20px;

overflow:hidden;

}

.avatar img{

width:100%;

height:100%;

object-fit:cover;

}

.name{

text-align:center;

font-size:28px;

font-weight:700;

}

.bio{

text-align:center;

color:#666;

margin-top:10px;

margin-bottom:25px;

line-height:1.6;

}

.stats{

display:flex;

justify-content:space-around;

margin-bottom:30px;

}

.stat{

text-align:center;

}

.stat h3{

color:#2563EB;

font-size:24px;

}

.stat p{

font-size:14px;

color:#777;

margin-top:5px;

}

.info{

display:grid;

grid-template-columns:1fr 1fr;

gap:18px;

margin-top:20px;

}

.item{

background:#F8FAFC;

padding:18px;

border-radius:16px;

}

.item h4{

color:#2563EB;

margin-bottom:8px;

font-size:15px;

}

.edit{

margin-top:35px;

}

.edit button{

width:100%;

padding:15px;

border:none;

background:linear-gradient(135deg,#4F46E5,#2563EB);

color:white;

font-size:16px;

font-weight:600;

border-radius:14px;

cursor:pointer;

transition:.3s;

}

.edit button:hover{

transform:translateY(-2px);

box-shadow:0 10px 25px rgba(37,99,235,.25);

}

.bottom-nav{

position:fixed;

bottom:0;

left:0;

width:100%;

background:white;

display:flex;

justify-content:space-around;

padding:16px 0;

border-top:1px solid #ddd;

}

.bottom-nav a{

font-size:24px;

color:#444;

transition:.3s;

}

.bottom-nav a:hover{

color:#2563EB;

}

@media(max-width:700px){

.info{

grid-template-columns:1fr;

}

.avatar{

width:100px;

height:100px;

font-size:40px;

}

.name{

font-size:24px;

}

}

</style>

</head>

<body>

<div class="container">

<div class="profile-card">

<div class="header">

<div class="logo">

LittleNet

</div>

<i class="fa-solid fa-ellipsis-vertical"></i>

</div>

<div class="avatar">

{% if profile.profile_picture %}
<img src="/{{ profile.profile_picture }}" alt="Profile">
{% else %}
<i class="fa-solid fa-user"></i>
{% endif %}

</div>

<div class="name">

{{ profile.full_name }}

</div>

<div class="bio">

{{ profile.bio }}

</div>

<div class="stats">

<div class="stat">

<h3>

<a href="/followers/">

Followers

</a>

</h3>

<p>Friends</p>

</div>

<div class="stat">

<h3>

<a href="/following/">

Following

</a>

</h3>

<p>Following</p>

</div>

</div>

<div class="info">

<div class="item">

<h4>

🎂 Age

</h4>

{{ profile.age }}

</div>

<div class="item">

<h4>

🏫 School

</h4>

{{ profile.school_name }}

</div>

<div class="item">

<h4>

📍 Location

</h4>

{{ profile.location }}

</div>

<div class="item">

<h4>

📚 Class

</h4>

{{ profile.current_class }}

</div>

</div>

<div class="edit">

<a href="/child/edit-profile/">

<button>

<i class="fa-solid fa-pen"></i>

Edit Profile

</button>

</a>

</div>

</div>

</div>

<div class="bottom-nav">

<a href="/feed/">

<i class="fa-solid fa-house"></i>

</a>

<a href="/discover/">

<i class="fa-solid fa-magnifying-glass"></i>

</a>

<a href="/child/upload-post/">

<i class="fa-solid fa-square-plus"></i>

</a>

<a href="/my-posts/">

<i class="fa-solid fa-heart"></i>

</a>

<a href="/child/profile/">

<i class="fa-solid fa-user"></i>

</a>

</div>

</body>

</html>
