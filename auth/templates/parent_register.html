<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parent Registration | LittleNet Supervision</title>
  
  <meta name="theme-color" content="#7950F2">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Nunito', sans-serif; }
    
    body {
      background: radial-gradient(circle at 10% 20%, rgba(243, 240, 255, 0.9) 0%, rgba(235, 248, 255, 0.8) 90%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 16px;
      color: #1e293b;
    }

    .parent-reg-container {
      width: 100%;
      max-width: 480px;
      animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes popIn {
      from { opacity: 0; transform: translateY(20px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .parent-card {
      background: #ffffff;
      border-radius: 28px;
      padding: 40px 34px;
      box-shadow: 0 20px 45px -10px rgba(15, 23, 42, 0.1), 0 1px 3px rgba(0, 0, 0, 0.02);
      border: 1px solid rgba(233, 236, 239, 0.8);
      position: relative;
      overflow: hidden;
    }

    .parent-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 6px;
      background: linear-gradient(90deg, #7950f2, #9775fa, #20c997);
    }

    .header-box {
      text-align: center;
      margin-bottom: 24px;
    }

    .shield-icon {
      width: 68px;
      height: 68px;
      margin: 0 auto 14px;
      border-radius: 22px;
      background: linear-gradient(135deg, #7950f2 0%, #9775fa 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      color: #ffffff;
      box-shadow: 0 10px 25px rgba(121, 80, 242, 0.28);
    }

    .header-title {
      font-size: 26px;
      font-weight: 900;
      color: #1e293b;
      margin-bottom: 6px;
    }

    .header-desc {
      font-size: 14px;
      font-weight: 600;
      color: #64748b;
      line-height: 1.5;
    }

    .feature-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 24px;
    }

    .feature-item {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 12px;
      font-weight: 800;
      color: #475569;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .feature-item i {
      color: #7950f2;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 800;
      color: #334155;
      margin-bottom: 6px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      color: #94a3b8;
      font-size: 15px;
      pointer-events: none;
    }

    .form-input {
      width: 100%;
      height: 50px;
      padding: 0 16px 0 44px;
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 600;
      color: #1e293b;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .form-input:focus {
      background: #ffffff;
      border-color: #7950f2;
      box-shadow: 0 0 0 4px rgba(121, 80, 242, 0.12);
    }

    .btn-submit {
      width: 100%;
      height: 52px;
      background: linear-gradient(135deg, #7950f2 0%, #9775fa 100%);
      color: #ffffff;
      border: none;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 10px 25px rgba(121, 80, 242, 0.28);
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      margin-top: 24px;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(121, 80, 242, 0.35);
    }

    .footer-note {
      text-align: center;
      margin-top: 24px;
      font-size: 12px;
      color: #94a3b8;
      font-weight: 700;
    }

    @media (max-width: 480px) {
      .parent-card {
        padding: 30px 22px;
      }
      .feature-list {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

<div class="parent-reg-container">
  <div class="parent-card">
    
    <div class="header-box">
      <div class="shield-icon">
        <i class="fa-solid fa-shield-cat"></i>
      </div>
      <h1 class="header-title">Parent Registration</h1>
      <p class="header-desc">Set up your LittleNet Parent Portal to supervise and safeguard your child's online experience.</p>
    </div>

    <div class="feature-list">
      <div class="feature-item">
        <i class="fa-solid fa-clock"></i>
        <span>Screen Time Limits</span>
      </div>
      <div class="feature-item">
        <i class="fa-solid fa-user-check"></i>
        <span>Follower Approvals</span>
      </div>
      <div class="feature-item">
        <i class="fa-solid fa-shield-virus"></i>
        <span>AI Content Filters</span>
      </div>
      <div class="feature-item">
        <i class="fa-solid fa-brain"></i>
        <span>Educational Quizzes</span>
      </div>
    </div>

    <form method="POST">
      <div class="form-group">
        <label class="form-label">Parent Full Name</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-user-tie input-icon"></i>
          <input type="text" name="full_name" class="form-input" placeholder="e.g. Sarah Jenkins" required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Parent Email Address</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-envelope input-icon"></i>
          <input type="email" name="email" class="form-input" placeholder="parent@mail.com" required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Create Password</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-lock input-icon"></i>
          <input type="password" name="password" class="form-input" placeholder="Create secure password" required>
        </div>
      </div>

      <button type="submit" class="btn-submit">
        <span>Create Parent Account</span>
        <i class="fa-solid fa-arrow-right"></i>
      </button>
    </form>

    <div class="footer-note">
      LittleNet Supervision &bull; Safe Social Network for Kids
    </div>
  </div>
</div>

</body>
</html>
