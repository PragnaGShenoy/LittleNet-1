<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>LittleNet | Login</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <link rel="manifest" href="/static/manifest.json">

    <meta name="theme-color" content="#4F46E5">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Inter',sans-serif;
        }

        body{

            background:linear-gradient(135deg,#EEF2FF,#E0F2FE,#FFFFFF);

            min-height:100vh;

            display:flex;

            justify-content:center;

            align-items:center;

            padding:20px;

        }

        .login-container{

            width:100%;
            max-width:420px;

        }

        .card{

            background:#fff;

            border-radius:24px;

            padding:40px 35px;

            box-shadow:
            0 15px 40px rgba(0,0,0,.08);

            animation:fade .6s ease;

        }

        @keyframes fade{

            from{
                opacity:0;
                transform:translateY(20px);
            }

            to{
                opacity:1;
                transform:translateY(0);
            }

        }

        .logo{

            width:80px;
            height:80px;

            margin:auto;

            border-radius:22px;

            background:linear-gradient(135deg,#4F46E5,#2563EB);

            display:flex;

            justify-content:center;

            align-items:center;

            color:white;

            font-size:32px;

            margin-bottom:18px;

        }

        h1{

            text-align:center;

            font-size:30px;

            color:#111827;

            margin-bottom:8px;

        }

        .subtitle{

            text-align:center;

            color:#6B7280;

            margin-bottom:30px;

            font-size:15px;

        }

        .input-group{

            position:relative;

            margin-bottom:18px;

        }

        .input-group i{

            position:absolute;

            left:16px;

            top:17px;

            color:#9CA3AF;

        }

        .input-group input{

            width:100%;

            height:54px;

            border:1px solid #E5E7EB;

            border-radius:14px;

            padding-left:46px;

            font-size:15px;

            outline:none;

            transition:.3s;

        }

        .input-group input:focus{

            border-color:#4F46E5;

            box-shadow:0 0 0 4px rgba(79,70,229,.12);

        }

        button{

            width:100%;

            height:54px;

            border:none;

            border-radius:14px;

            background:linear-gradient(135deg,#4F46E5,#2563EB);

            color:white;

            font-size:16px;

            font-weight:600;

            cursor:pointer;

            transition:.3s;

        }

        button:hover{

            transform:translateY(-2px);

            box-shadow:0 12px 25px rgba(37,99,235,.30);

        }

        .register{

            text-align:center;

            margin-top:24px;

            color:#6B7280;

            font-size:15px;

        }

        .register a{

            color:#2563EB;

            text-decoration:none;

            font-weight:600;

        }

        .register a:hover{

            text-decoration:underline;

        }

        .footer{

            text-align:center;

            margin-top:25px;

            font-size:13px;

            color:#9CA3AF;

        }

        @media(max-width:480px){

            .card{

                padding:28px 22px;

                border-radius:20px;

            }

            h1{

                font-size:26px;

            }

        }

    </style>

</head>

<body>

<div class="login-container">

<div class="card">

<div class="logo">
<i class="fa-solid fa-child-reaching"></i>
</div>

<h1>LittleNet</h1>

<p class="subtitle">
A Safe Social Network for Kids
</p>

<form method="POST">

<div class="input-group">

<i class="fa-solid fa-envelope"></i>

<input
type="email"
name="email"
placeholder="Email Address"
required>

</div>

<div class="input-group">

<i class="fa-solid fa-lock"></i>

<input
type="password"
name="password"
placeholder="Password"
required>

</div>

<button type="submit">

<i class="fa-solid fa-right-to-bracket"></i>

&nbsp;

Login

</button>

</form>

<div class="register">

New Child User?

<a href="/register-child">

Create Account

</a>

</div>

<div class="footer">

© 2026 LittleNet

</div>

</div>

</div>

<script>

if ('serviceWorker' in navigator) {

navigator.serviceWorker.register('/static/sw.js')

.then(function () {

console.log("Service Worker Registered");

})

.catch(function (err) {

console.log(err);

});

}

</script>

</body>

</html>
