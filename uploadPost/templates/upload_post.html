<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Post | LittleNet</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Nunito',sans-serif;}
a{text-decoration:none;color:inherit;}
body{background:#fafafa;min-height:100vh;padding-bottom:70px;}

/* ── Header ── */
.ig-header{
  position:sticky;top:0;z-index:999;
  background:rgba(255,255,255,.97);backdrop-filter:blur(14px);
  border-bottom:1px solid #dbdbdb;
}
.ig-header-inner{
  max-width:470px;margin:0 auto;
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;
}
.ig-back{font-size:21px;color:#262626;cursor:pointer;width:36px;}
.ig-back:hover{color:#e76f51;}
.ig-title{font-size:17px;font-weight:900;color:#262626;}
.ig-share-btn{
  padding:7px 18px;border-radius:8px;border:none;cursor:pointer;
  background:#0095f6;color:white;font-size:14px;font-weight:900;
  font-family:'Nunito',sans-serif;transition:.2s;
}
.ig-share-btn:hover{background:#0081d6;}
.ig-share-btn:disabled{opacity:.5;cursor:not-allowed;}

/* ── Page ── */
.page{max-width:470px;margin:0 auto;}

/* ── Media preview ── */
.media-preview{
  width:100%;aspect-ratio:1/1;background:#efefef;
  position:relative;overflow:hidden;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  border-bottom:1px solid #dbdbdb;
}
.media-preview img,.media-preview video{
  width:100%;height:100%;object-fit:cover;display:block;
}
.media-placeholder{
  display:flex;flex-direction:column;align-items:center;gap:14px;
  color:#8e8e8e;
}
.media-placeholder i{font-size:54px;}
.media-placeholder p{font-size:15px;font-weight:700;}

/* ── Pick row ── */
.pick-row{
  display:flex;gap:0;border-bottom:1px solid #dbdbdb;
}
.pick-btn{
  flex:1;padding:14px;border:none;background:white;cursor:pointer;
  font-size:14px;font-weight:800;color:#262626;
  display:flex;align-items:center;justify-content:center;gap:8px;
  font-family:'Nunito',sans-serif;transition:.15s;
}
.pick-btn:first-child{border-right:1px solid #dbdbdb;}
.pick-btn:hover{background:#f9f9f9;}
.pick-btn i{color:#e76f51;font-size:16px;}

/* ── Form section ── */
.form-section{background:white;}

.caption-row{
  display:flex;align-items:flex-start;gap:12px;
  padding:14px 16px;border-bottom:1px solid #dbdbdb;
}
.caption-avatar{
  width:38px;height:38px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,#ffecd2,#fcb69f);
  display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:900;color:#7c3700;overflow:hidden;
}
.caption-avatar img{width:100%;height:100%;object-fit:cover;}
.caption-input{
  flex:1;border:none;outline:none;resize:none;
  font-size:15px;font-weight:600;color:#262626;
  min-height:80px;background:transparent;
  font-family:'Nunito',sans-serif;line-height:1.6;
}
.caption-input::placeholder{color:#8e8e8e;}

/* ── Category section ── */
.section-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;border-bottom:1px solid #dbdbdb;
  cursor:pointer;
}
.section-row-label{font-size:15px;font-weight:700;color:#262626;display:flex;align-items:center;gap:10px;}
.section-row-label i{color:#e76f51;width:20px;text-align:center;}
.section-row-value{font-size:14px;font-weight:700;color:#8e8e8e;display:flex;align-items:center;gap:6px;}
.section-row-value i{font-size:12px;}

/* Category drawer */
.cat-drawer{
  display:none;padding:14px 16px 18px;border-bottom:1px solid #dbdbdb;
  background:#fafafa;
}
.cat-drawer.open{display:block;}
.cat-grid{display:flex;flex-wrap:wrap;gap:8px;}
.cat-chip{
  padding:8px 16px;border-radius:50px;font-size:13px;font-weight:800;
  cursor:pointer;border:2px solid transparent;transition:.2s;
}
.cat-chip:hover{transform:scale(1.05);}
.cat-chip.selected{border-color:currentColor;box-shadow:0 2px 8px rgba(0,0,0,.1);}
.c1{background:#dbeafe;color:#1d4ed8;}
.c2{background:#d1fae5;color:#065f46;}
.c3{background:#ede9fe;color:#5b21b6;}
.c4{background:#fce7f3;color:#be185d;}
.c5{background:#fef3c7;color:#78350f;}
.c6{background:#ffedd5;color:#c2410c;}
.c7{background:#ecfccb;color:#365314;}
.c8{background:#e0f2fe;color:#0369a1;}
.c9{background:#fdf2f8;color:#86198f;}
.c10{background:#f0fdf4;color:#14532d;}
.c11{background:#f3f4f6;color:#6b7280;}

/* Hidden inputs */
input[type=file]{display:none;}
select#content_category{display:none;}

/* ── Uploading overlay ── */
.uploading-overlay{
  display:none;position:fixed;inset:0;z-index:9999;
  background:rgba(255,255,255,.9);backdrop-filter:blur(6px);
  flex-direction:column;align-items:center;justify-content:center;gap:16px;
}
.uploading-overlay.show{display:flex;}
.upload-spinner{
  width:60px;height:60px;border-radius:50%;
  border:5px solid #efefef;border-top-color:#0095f6;
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}
.upload-text{font-size:16px;font-weight:900;color:#262626;}
.upload-sub{font-size:13px;font-weight:600;color:#8e8e8e;}

/* ── Result modal ── */
.result-modal-overlay{
  display:none;position:fixed;inset:0;z-index:10000;
  background:rgba(0,0,0,.5);align-items:center;justify-content:center;
}
.result-modal-overlay.show{display:flex;}
.result-modal{
  background:white;border-radius:20px;padding:32px 26px;
  text-align:center;max-width:300px;width:90%;
}
.result-modal .modal-icon{font-size:56px;margin-bottom:12px;display:block;}
.result-modal h3{font-size:18px;font-weight:900;color:#262626;margin-bottom:8px;}
.result-modal p{font-size:14px;color:#8e8e8e;font-weight:600;margin-bottom:20px;line-height:1.5;}
.modal-btn{
  display:inline-block;padding:10px 24px;border-radius:8px;
  font-size:14px;font-weight:900;cursor:pointer;border:none;
  font-family:'Nunito',sans-serif;transition:.2s;
}
.modal-btn-ok{background:#efefef;color:#262626;}
.modal-btn-ok:hover{background:#e0e0e0;}
.modal-btn-go{background:#0095f6;color:white;margin-left:8px;}
.modal-btn-go:hover{background:#0081d6;}

/* ── Live camera modal ── */
.cam-overlay{
  display:none;position:fixed;inset:0;z-index:10001;
  background:rgba(0,0,0,.85);align-items:center;justify-content:center;
}
.cam-overlay.show{display:flex;}
.cam-box{
  background:white;border-radius:20px;overflow:hidden;
  width:min(96vw,460px);display:flex;flex-direction:column;
}
.cam-header{
  padding:14px 18px;display:flex;justify-content:space-between;align-items:center;
  border-bottom:1px solid #dbdbdb;
}
.cam-header span{font-size:16px;font-weight:900;color:#262626;}
.cam-close{background:none;border:none;font-size:22px;cursor:pointer;color:#262626;}
#camVideo{width:100%;max-height:52vh;object-fit:cover;background:#111;display:block;}
#camCanvas{display:none;}
.cam-footer{
  padding:14px 18px;display:flex;gap:10px;justify-content:center;
  background:white;border-top:1px solid #dbdbdb;
}
.cam-snap{
  padding:11px 28px;border-radius:8px;border:none;cursor:pointer;
  background:#0095f6;color:white;font-size:14px;font-weight:900;
  font-family:'Nunito',sans-serif;transition:.2s;
}
.cam-snap:hover{background:#0081d6;}
.cam-retake{
  padding:11px 20px;border-radius:8px;border:1.5px solid #dbdbdb;cursor:pointer;
  background:white;color:#262626;font-size:14px;font-weight:800;
  font-family:'Nunito',sans-serif;display:none;transition:.2s;
}
.cam-retake:hover{background:#f3f4f6;}
.cam-use{
  padding:11px 22px;border-radius:8px;border:none;cursor:pointer;
  background:#0095f6;color:white;font-size:14px;font-weight:900;
  font-family:'Nunito',sans-serif;display:none;transition:.2s;
}
.cam-use:hover{background:#0081d6;}

/* ── Bottom nav ── */
.bottom-nav{
  position:fixed;bottom:0;left:0;width:100%;z-index:998;
  background:rgba(255,255,255,.97);backdrop-filter:blur(14px);
  border-top:1px solid #dbdbdb;
  display:flex;justify-content:space-around;align-items:center;
  padding:10px 0 14px;
}
.nav-item{display:flex;flex-direction:column;align-items:center;color:#262626;padding:4px 12px;transition:.2s;}
.nav-item i{font-size:24px;transition:.2s;}
.nav-item.active i{color:#e76f51;}
.nav-item:hover i{color:#e76f51;transform:scale(1.1);}
</style>
</head>
<body>

<!-- Uploading overlay -->
<div class="uploading-overlay" id="uploadingOverlay">
  <div style="font-size:48px;">📸</div>
  <div class="upload-spinner"></div>
  <div class="upload-text">Checking your post…</div>
  <div class="upload-sub">Our safety helpers are reviewing it ✨</div>
</div>

<!-- Header -->
<div class="ig-header">
  <div class="ig-header-inner">
    <a class="ig-back" href="/child/dashboard/"><i class="fa-solid fa-arrow-left"></i></a>
    <div class="ig-title">New post</div>
    <button class="ig-share-btn" id="shareBtn" onclick="submitPost()">Share</button>
  </div>
</div>

<div class="page">

  <form method="POST" enctype="multipart/form-data" id="postForm">

    <!-- Media preview (tap to pick from gallery) -->
    <div class="media-preview" id="mediaPreview" onclick="document.getElementById('media').click()">
      <div class="media-placeholder" id="mediaPlaceholder">
        <i class="fa-regular fa-image"></i>
        <p>Tap to select a photo or video</p>
      </div>
    </div>

    <!-- Pick row: Gallery / Camera -->
    <div class="pick-row">
      <button type="button" class="pick-btn" onclick="document.getElementById('media').click()">
        <i class="fa-regular fa-images"></i> Gallery
      </button>
      <button type="button" class="pick-btn" onclick="openCamera()">
        <i class="fa-solid fa-camera"></i> Camera
      </button>
    </div>

    <!-- Hidden file inputs -->
    <input type="file" name="media" id="media" accept="image/*,video/*">
    <input type="file" name="media" id="mediaCam" accept="image/*" style="display:none;">

    <!-- Caption + avatar row -->
    <div class="form-section">
      <div class="caption-row">
        <div class="caption-avatar" id="userAvatar">🧒</div>
        <textarea class="caption-input" name="caption" id="captionInput" placeholder="Write a caption…" rows="3"></textarea>
      </div>

      <!-- Category -->
      <div class="section-row" onclick="toggleCatDrawer()">
        <div class="section-row-label">
          <i class="fa-solid fa-layer-group"></i> Category
        </div>
        <div class="section-row-value" id="catDisplay">
          Add category <i class="fa-solid fa-chevron-right"></i>
        </div>
      </div>

      <!-- Category chips drawer -->
      <div class="cat-drawer" id="catDrawer">
        <div class="cat-grid">
          <div class="cat-chip c1"  data-val="Technology">💻 Tech</div>
          <div class="cat-chip c2"  data-val="AI">🤖 AI</div>
          <div class="cat-chip c3"  data-val="Programming">🧑‍💻 Code</div>
          <div class="cat-chip c4"  data-val="Robotics">🦾 Robots</div>
          <div class="cat-chip c5"  data-val="Science">🔬 Science</div>
          <div class="cat-chip c6"  data-val="Sports">⚽ Sports</div>
          <div class="cat-chip c7"  data-val="Drawing">🎨 Art</div>
          <div class="cat-chip c8"  data-val="Music">🎵 Music</div>
          <div class="cat-chip c9"  data-val="Dance">💃 Dance</div>
          <div class="cat-chip c10" data-val="Education">📚 Learn</div>
          <div class="cat-chip c11" data-val="Other">✨ Other</div>
        </div>
      </div>

      <!-- Hidden real select -->
      <select name="content_category" id="content_category" required></select>

    </div>

  </form>
</div>

<!-- Live camera modal -->
<div class="cam-overlay" id="camOverlay">
  <div class="cam-box">
    <div class="cam-header">
      <span>Take a Photo</span>
      <button class="cam-close" onclick="closeCamera()">✕</button>
    </div>
    <video id="camVideo" autoplay playsinline muted></video>
    <canvas id="camCanvas"></canvas>
    <div class="cam-footer">
      <button type="button" class="cam-snap"   id="camSnapBtn"   onclick="snapPhoto()">Snap</button>
      <button type="button" class="cam-retake" id="camRetakeBtn" onclick="retakePhoto()">Retake</button>
      <button type="button" class="cam-use"    id="camUseBtn"    onclick="usePhoto()">Use Photo</button>
    </div>
  </div>
</div>

<!-- Result modal -->
<div class="result-modal-overlay" id="resultModal">
  <div class="result-modal">
    <span class="modal-icon" id="modalIcon"></span>
    <h3 id="modalTitle"></h3>
    <p id="modalMsg"></p>
    <button class="modal-btn modal-btn-ok" onclick="closeModal()">Try Again</button>
    <a href="/my-posts/" class="modal-btn modal-btn-go" id="modalGoBtn" style="display:none;">View Posts</a>
  </div>
</div>

<!-- Bottom nav -->
<nav class="bottom-nav">

    <!-- Home -->
    <a class="nav-item active" href="/child/dashboard/">
        🏠
    </a>

    <!-- Discover -->
    <a class="nav-item" href="/discover/">
        🔍
    </a>

    <!-- Create Post -->
    <a class="nav-item nav-post" href="/child/upload-post/">
        ➕
    </a>

    <!-- Quiz -->
    <a class="nav-item" href="/quiz/start/">
        🧠
    </a>

    <!-- Profile -->
    <a class="nav-item" href="/child/profile/">
        👤
    </a>

</nav>

<script>
var _capturedBlob = null;
var _selectedCategory = '';

// ── File picker → preview ──
document.getElementById('media').addEventListener('change', function(){
  var file = this.files[0]; if(!file) return;
  showPreview(file, URL.createObjectURL(file));
});

function showPreview(file, url){
  var wrap = document.getElementById('mediaPreview');
  document.getElementById('mediaPlaceholder').style.display = 'none';
  var old = wrap.querySelector('img,video'); if(old) old.remove();
  if(file && file.type.startsWith('video/')){
    var vid = document.createElement('video');
    vid.src = url; vid.controls = false; vid.muted = true; vid.autoplay = true; vid.loop = true;
    vid.style.cssText = 'width:100%;height:100%;object-fit:cover;';
    wrap.appendChild(vid);
  } else {
    var img = document.createElement('img');
    img.src = url;
    wrap.appendChild(img);
  }
}

// ── Category chips ──
var select = document.getElementById('content_category');
document.querySelectorAll('.cat-chip').forEach(function(chip){
  chip.addEventListener('click', function(){
    document.querySelectorAll('.cat-chip').forEach(function(c){ c.classList.remove('selected'); });
    chip.classList.add('selected');
    _selectedCategory = chip.dataset.val;
    document.getElementById('catDisplay').innerHTML = chip.textContent + ' <i class="fa-solid fa-chevron-down"></i>';
  });
});

function toggleCatDrawer(){
  document.getElementById('catDrawer').classList.toggle('open');
}

// ── Camera ──
var _camStream = null;

function openCamera(){
  _capturedBlob = null;
  navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false})
    .then(function(stream){
      _camStream = stream;
      var v = document.getElementById('camVideo');
      v.srcObject = stream; v.style.display = 'block';
      document.getElementById('camCanvas').style.display = 'none';
      document.getElementById('camSnapBtn').style.display = 'inline-flex';
      document.getElementById('camRetakeBtn').style.display = 'none';
      document.getElementById('camUseBtn').style.display = 'none';
      document.getElementById('camOverlay').classList.add('show');
    })
    .catch(function(err){ alert('Cannot access camera: ' + err.message); });
}

function closeCamera(){
  if(_camStream){ _camStream.getTracks().forEach(function(t){t.stop();}); _camStream=null; }
  document.getElementById('camOverlay').classList.remove('show');
}

function snapPhoto(){
  var v = document.getElementById('camVideo');
  var c = document.getElementById('camCanvas');
  c.width = v.videoWidth; c.height = v.videoHeight;
  c.getContext('2d').drawImage(v,0,0);
  c.style.display='block'; v.style.display='none';
  document.getElementById('camSnapBtn').style.display='none';
  document.getElementById('camRetakeBtn').style.display='inline-flex';
  document.getElementById('camUseBtn').style.display='inline-flex';
  c.toBlob(function(blob){ _capturedBlob = blob; }, 'image/jpeg', 0.92);
}

function retakePhoto(){
  var v=document.getElementById('camVideo'), c=document.getElementById('camCanvas');
  c.style.display='none'; v.style.display='block';
  document.getElementById('camSnapBtn').style.display='inline-flex';
  document.getElementById('camRetakeBtn').style.display='none';
  document.getElementById('camUseBtn').style.display='none';
  _capturedBlob = null;
}

function usePhoto(){
  if(!_capturedBlob) return;
  closeCamera();
  var fakeFile = new File([_capturedBlob], 'camera_photo.jpg', {type:'image/jpeg'});
  showPreview(fakeFile, URL.createObjectURL(_capturedBlob));
}

// ── Submit ──
function submitPost(){

  var file = document.getElementById('media').files[0];

  if(!file && !_capturedBlob){
    alert('Please pick or take a photo/video!');
    return;
  }

  if(!_selectedCategory){
    alert('Please select a category!');
    return;
  }


  document.getElementById('uploadingOverlay').classList.add('show');
  document.getElementById('shareBtn').disabled = true;


  var fd = new FormData();


  if(_capturedBlob){

    fd.append(
      'media',
      _capturedBlob,
      'camera_photo.jpg'
    );

  } else {

    fd.append(
      'media',
      file,
      file.name
    );

  }


  fd.append(
    'caption',
    document.getElementById('captionInput').value
  );

  fd.append(
    'content_category',
    _selectedCategory
  );


  fetch(
    window.location.pathname,
    {
      method: 'POST',
      body: fd
    }
  )

  .then(function(response){

    /*
     * IMPORTANT:
     * Even if Flask returns 400 because
     * content is blocked, we still read
     * the JSON response.
     */

    return response.json();

  })

  .then(function(data){

    document.getElementById(
      'uploadingOverlay'
    ).classList.remove('show');

    document.getElementById(
      'shareBtn'
    ).disabled = false;


    /*
     * Backend says content is blocked
     */

    if(data.success === false){

      showModal(
        false,
        data.category || 'INAPPROPRIATE'
      );

      return;

    }


    /*
     * Backend says post was successfully shared
     */

    showModal(
      true,
      data.category
    );

  })

  .catch(function(error){

    console.error(
      'Upload error:',
      error
    );


    document.getElementById(
      'uploadingOverlay'
    ).classList.remove('show');

    document.getElementById(
      'shareBtn'
    ).disabled = false;


    showModal(
      false,
      'UNKNOWN'
    );

  });

}

function showModal(success, category){
 var labels = {

  ADULT: {
    emoji: '🚫',
    title: 'Content Not Allowed',
    text: 'This content contains adult material and cannot be posted on LittleNet.'
  },

  INAPPROPRIATE: {
    emoji: '🚫',
    title: 'Content Not Allowed',
    text: 'This content is not suitable for children and cannot be posted on LittleNet.'
  },

  VIOLENCE: {
    emoji: '⚠️',
    title: 'Violent Content',
    text: 'This content appears to contain violent imagery. Please choose something friendly!'
  },

  WEAPON: {
    emoji: '🛡️',
    title: 'Weapons Detected',
    text: 'Weapons were detected in this content. Please upload something safe.'
  },

  DRUG: {
    emoji: '🚷',
    title: 'Not Allowed',
    text: 'This content appears to show drugs or alcohol. That is not allowed on LittleNet!'
  },

  BULLYING: {
    emoji: '💔',
    title: 'Be Kind',
    text: 'This content may show bullying or harassment. Be kind to each other!'
  },

  UNKNOWN: {
    emoji: '😕',
    title: 'Something went wrong',
    text: 'An unexpected error occurred while checking your content. Please try again.'
  }

};
  if(success){
    document.getElementById('modalIcon').textContent  = '🎉';
    document.getElementById('modalTitle').textContent = 'Post Shared!';
    document.getElementById('modalMsg').textContent   = 'Your post is now live on LittleNet! 🌟';
    document.querySelector('.modal-btn-ok').style.display = 'none';
    document.getElementById('modalGoBtn').style.display   = 'inline-block';
  } else {
    var info = labels[category] || labels['UNKNOWN'];
    document.getElementById('modalIcon').textContent  = info.emoji;
    document.getElementById('modalTitle').textContent = info.title;
    document.getElementById('modalMsg').textContent   = info.text;
    document.querySelector('.modal-btn-ok').style.display = 'inline-block';
    document.getElementById('modalGoBtn').style.display   = 'none';
  }
  document.getElementById('resultModal').classList.add('show');
}

function closeModal(){
  document.getElementById('resultModal').classList.remove('show');
}
</script>
</body>
</html>
