<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LittleNet - Create Post</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{

background:#f4f7fb;

padding:20px;

}

.container{

max-width:700px;

margin:auto;

}

.card{

background:white;

border-radius:20px;

padding:30px;

box-shadow:0 10px 30px rgba(0,0,0,.08);

animation:fade .5s;

}

@keyframes fade{

from{

opacity:0;
transform:translateY(20px);

}

to{

opacity:1;
transform:translateY(0);

}

}

.header{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:30px;

}

.logo{

font-size:30px;

font-weight:700;

color:#2563EB;

}

.back{

text-decoration:none;

color:#2563EB;

font-weight:600;

}

.preview{

width:180px;

height:180px;

margin:auto;

border-radius:20px;

background:#EEF4FF;

display:flex;

justify-content:center;

align-items:center;

font-size:70px;

color:#2563EB;

overflow:hidden;

margin-bottom:25px;

}

.preview img{

width:100%;
height:100%;
object-fit:cover;

}

.group{

margin-bottom:20px;

}

.group label{

display:block;

font-weight:600;

margin-bottom:8px;

color:#444;

}

.group input[type=file]{

width:100%;

padding:12px;

border:2px dashed #2563EB;

border-radius:15px;

background:#F8FAFF;

cursor:pointer;

}

.group textarea{

width:100%;

height:140px;

padding:15px;

border-radius:15px;

border:1px solid #ddd;

resize:none;

font-size:15px;

outline:none;

}

.group textarea:focus{

border-color:#2563EB;

}

.group select{

width:100%;

padding:15px;

border-radius:15px;

border:1px solid #ddd;

font-size:15px;

outline:none;

}

.group select:focus{

border-color:#2563EB;

}

button{

width:100%;

padding:16px;

background:linear-gradient(135deg,#2563EB,#4F46E5);

border:none;

border-radius:15px;

color:white;

font-size:17px;

font-weight:600;

cursor:pointer;

transition:.3s;

}

button:hover{

transform:translateY(-2px);

box-shadow:0 10px 25px rgba(37,99,235,.30);

}

.bottom-nav{

position:fixed;

bottom:0;

left:0;

width:100%;

background:white;

display:flex;

justify-content:space-around;

padding:16px 0;

border-top:1px solid #ddd;

}

.bottom-nav a{

font-size:24px;

color:#555;

text-decoration:none;

transition:.3s;

}

.bottom-nav a:hover{

color:#2563EB;

}

@media(max-width:768px){

.card{

padding:20px;

}

.preview{

width:140px;
height:140px;

}

}

</style>

</head>

<body>

<div class="container">

<div class="card">

<div class="header">

<div class="logo">

LittleNet

</div>

<a href="/child/dashboard/" class="back">

<i class="fa-solid fa-arrow-left"></i>

Dashboard

</a>

</div>

<form method="POST"
enctype="multipart/form-data">

<div class="preview" id="preview">

<i class="fa-solid fa-image"></i>

</div>

<div class="group">

<label>

<i class="fa-solid fa-photo-film"></i>

Choose Image / Video

</label>

<input
type="file"
name="media"
id="media"
required>

</div>

<div class="group">

<label>

<i class="fa-solid fa-pen"></i>

Description

</label>

<textarea
name="caption"
placeholder="Share your thoughts..."></textarea>

</div>

<div class="group">

<label>

<i class="fa-solid fa-layer-group"></i>

Content Category

</label>

<select
name="content_category"
required>

<option value="">Select Category</option>

<option value="Technology">Technology</option>
<option value="AI">AI</option>
<option value="Programming">Programming</option>
<option value="Robotics">Robotics</option>
<option value="Science">Science</option>
<option value="Sports">Sports</option>
<option value="Drawing">Drawing</option>
<option value="Music">Music</option>
<option value="Dance">Dance</option>
<option value="Education">Education</option>
<option value="Other">Other</option>

</select>

</div>

<button type="submit">

<i class="fa-solid fa-paper-plane"></i>

Upload Post

</button>

</form>

</div>

</div>

<div class="bottom-nav">

<a href="/child/dashboard/">

<i class="fa-solid fa-house"></i>

</a>

<a href="/discover/">

<i class="fa-solid fa-magnifying-glass"></i>

</a>

<a href="/child/upload-post/">

<i class="fa-solid fa-square-plus" style="color:#2563EB;"></i>

</a>

<a href="/my-posts/">

<i class="fa-solid fa-heart"></i>

</a>

<a href="/child/profile/">

<i class="fa-solid fa-user"></i>

</a>

</div>

<script>

const media=document.getElementById("media");

const preview=document.getElementById("preview");

media.onchange=function(){

const file=this.files[0];

if(!file)return;

const reader=new FileReader();

reader.onload=function(e){

preview.innerHTML=
`<img src="${e.target.result}">`;

}

reader.readAsDataURL(file);

}

</script>

</body>

</html>
